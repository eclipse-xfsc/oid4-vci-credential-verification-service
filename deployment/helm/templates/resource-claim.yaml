{{- $annotations := default dict .Values.podAnnotations -}}
{{- $injectionEnabled := eq (default "false" (index $annotations "inject.xfsc.io/enabled")) "true" -}}
{{- if and $injectionEnabled .Values.resourceClaim.cassandra.enabled }}
apiVersion: resources.xfsc.io/v1alpha1
kind: ResourceClaim
metadata:
  name: {{ printf "%s-cassandra-resource-claim" .Release.Name | quote }}
  namespace: {{ .Release.Namespace }}
spec:
  type: cassandra
  providerRef:
    name: {{ .Values.resourceClaim.cassandra.providerRef | quote }}
  externalSecretRef:
    name: {{ printf "%s-cassandra-credentials" .Release.Name | quote }}
  parameters:
    keyspace: {{ .Values.resourceClaim.cassandra.keyspace | quote }}
    replicationFactor: {{ .Values.resourceClaim.cassandra.replicationFactor }}
    durableWrites: {{ .Values.resourceClaim.cassandra.durableWrites }}
    datacenter: {{ .Values.resourceClaim.cassandra.datacenter | quote }}
{{- end }}
