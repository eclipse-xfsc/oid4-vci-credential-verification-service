version: "3.9"

networks:
  internal:
    driver: bridge

services:
  nats:
    image: nats:2.10-alpine
    command: ["--http_port", "8222"]
    networks:
      - internal
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  cassandra:
    image: cassandra:5.0
    networks:
      - internal
    volumes:
      - cassandra-data:/var/lib/cassandra
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 30s

  cassandra-init:
    image: cassandra:5.0
    networks:
      - internal
    depends_on:
      cassandra:
        condition: service_healthy
    command:
      - bash
      - -ec
      - |
        cqlsh cassandra 9042 -e "CREATE KEYSPACE IF NOT EXISTS ocm WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};"
        echo 'ocm ready'
    restart: "no"

  openbao:
    image: openbao/openbao:2.5.3
    networks:
      - internal
    cap_add:
      - IPC_LOCK
    command:
      - server
      - -dev
      - -dev-root-token-id=test
      - -dev-listen-address=0.0.0.0:8200
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      retries: 20

  openbao-init:
    image: curlimages/curl:8.12.1
    networks:
      - internal
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://openbao:8200
      VAULT_TOKEN: test
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        echo "Initializing OpenBao..."

        echo "Enabling transit secrets engine..."
        curl --fail --silent --show-error \
          --header "X-Vault-Token: $${VAULT_TOKEN}" \
          --request POST \
          --data '{"type":"transit"}' \
          "$${VAULT_ADDR}/v1/sys/mounts/transit" \
          || echo "Transit secrets engine may already be enabled"

        echo "Creating signing key..."
        curl --fail --silent --show-error \
          --header "X-Vault-Token: $${VAULT_TOKEN}" \
          --request POST \
          --data '{"type":"ecdsa-p256"}' \
          "$${VAULT_ADDR}/v1/transit/keys/test" \
          || echo "Signing key may already exist"

        echo "OpenBao initialization completed."
    restart: "no"

  crypto-engine:
    image: ${CRYPTO_ENGINE_IMAGE:-node-654e3bca7fbeeed18f81d7c7.de-west-1.xaas.plus.cloud/tsa/crypto-provider-hashicorp-vault-plugin:2.0.6}
    networks:
      - internal
    depends_on:
      openbao-init:
        condition: service_completed_successfully
    environment:
      CRYPTO_GRPC_ADDR: 0.0.0.0:50051
      VAULT_ADRESS: http://openbao:8200
      VAULT_TOKEN: test
    ports:
      - "50051:50051"

  signer:
    image: ${SIGNER_IMAGE:-node-654e3bca7fbeeed18f81d7c7.de-west-1.xaas.plus.cloud/tsa/signer:2.3.7}
    networks:
      - internal
    depends_on:
      crypto-engine:
        condition: service_started
      nats:
        condition: service_healthy
    environment:
      CRYPTO_GRPC_ADDR: crypto-engine:50051
      ENGINE_TIMEOUT: "30"
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      NATS_HOST: nats:4222
      NATS_TOPIC: signer-topic
      LOG_LEVEL: DEBUG
    ports:
      - "9000:8080"

  storage:
    image: ${STORAGE_IMAGE:-node-654e3bca7fbeeed18f81d7c7.de-west-1.xaas.plus.cloud/ocm-wstack/storage-service:1.3.0}
    networks:
      - internal

    depends_on:
      nats:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
      crypto-engine:
        condition: service_started

    environment:
      # General
      STORAGESERVICE_PROFILE: DEBUG:LOCAL
      STORAGESERVICE_MODE: DIRECT
      STORAGESERVICE_UNITTESTMODEON: "false"

      # NATS
      STORAGESERVICE_NATS_URL: nats:4222
      STORAGESERVICE_NATS_STORAGETOPIC: storage
      STORAGESERVICE_NATS_QUEUEGROUP: storage
      STORAGESERVICE_NATS_REQUEST_TIMEOUT: "30"

      # Crypto Provider / Crypto Engine
      STORAGESERVICE_CRYPTO_GRPC_ADDR: crypto-engine:50051
      STORAGESERVICE_CRYPTO_NAMESPACE: transit
      STORAGESERVICE_CRYPTO_SIGNKEY: test
      STORAGESERVICE_CRYPTO_GROUP: ""

      # Cassandra
      STORAGESERVICE_CASSANDRA_HOSTS: cassandra
      STORAGESERVICE_CASSANDRA_KEYSPACE: ocm
      STORAGESERVICE_CASSANDRA_USER: ""
      STORAGESERVICE_CASSANDRA_PASSWORD: ""

      # Database migrations
      STORAGESERVICE_MIGRATIONS_ENABLED: "true"
      STORAGESERVICE_MIGRATIONS_TABLE: storage_schema_migrations
      STORAGESERVICE_MIGRATIONS_TIMEOUT: 2m

    ports:
      - "9080:8080"

  resolver:
    image: ${RESOLVER_IMAGE:-universalresolver/uni-resolver-web:latest}
    networks:
      - internal
    ports:
      - "8134:8080"

  verification:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    networks:
      - internal
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      signer:
        condition: service_started
      storage:
        condition: service_started
      resolver:
        condition: service_started
    environment:
      CREDENTIALVERIFICATION_LISTEN_ADDR: 0.0.0.0
      CREDENTIALVERIFICATION_LISTEN_PORT: "8080"
      CREDENTIALVERIFICATION_SERVERMODE: debug
      CREDENTIALVERIFICATION_LOG_LEVEL: debug

      CREDENTIALVERIFICATION_CASSANDRA_HOST: cassandra
      CREDENTIALVERIFICATION_CASSANDRA_KEYSPACE: ocm
      CREDENTIALVERIFICATION_CASSANDRA_USER: ""
      CREDENTIALVERIFICATION_CASSANDRA_PASSWORD: ""

      CREDENTIALVERIFICATION_COUNTRY: DE
      CREDENTIALVERIFICATION_REGION: EU
      CREDENTIALVERIFICATION_MIGRATIONS_ENABLED: "true"

      CREDENTIALVERIFICATION_NATS_URL: nats:4222
      CREDENTIALVERIFICATION_NATS_QUEUE_GROUP: verification
      CREDENTIALVERIFICATION_PROTOCOL: nats

      CREDENTIALVERIFICATION_SIGNER_TOPIC: signer-topic
      CREDENTIALVERIFICATION_SIGNER_PRESENTATIONSIGNURL: http://signer:8080/v1/presentation/proof
      CREDENTIALVERIFICATION_SIGNER_PRESENTATIONVERIFYURL: http://signer:8080/v1/presentation/verify

      CREDENTIALVERIFICATION_STORAGE_TOPIC: storage

      CREDENTIALVERIFICATION_AUTHORIZATION: presentation.authorisation
      CREDENTIALVERIFICATION_AUTHORIZATIONREPLY: presentation.authorisation.reply
      CREDENTIALVERIFICATION_PRESENTATIONREQUEST: request
      CREDENTIALVERIFICATION_PROOFNOTIFY: presentation.proof.notify

      CREDENTIALVERIFICATION_EXTERNALPRESENTATION_ENABLED: "true"
      CREDENTIALVERIFICATION_EXTERNALPRESENTATION_AUTHORIZEENDPOINT: http://playground:8090/callback
      CREDENTIALVERIFICATION_EXTERNALPRESENTATION_CLIENTURLSCHEMA: http

      CREDENTIALVERIFICATION_PUBLICBASEPATH: /presentation/proof
      CREDENTIALVERIFICATION_STATESIGNINGKEY: ${VERIFICATION_STATE_SIGNING_KEY:-local-dev-state-signing-key-change-me}

      DID_RESOLVER: ${DID_RESOLVER:-http://resolver:8080/1.0/identifiers/}

    ports:
      - "127.0.0.1:8086:8080"

  playground:
    build: ./playground
    networks:
      - internal
    depends_on:
      nats:
        condition: service_healthy
      verification:
        condition: service_started
    environment:
      NATS_URL: nats://nats:4222
      VERIFICATION_URL: http://verification:8080
      PUBLIC_VERIFICATION_URL: http://localhost:8086
      PUBLIC_PLAYGROUND_URL: http://localhost:8090
      NATS_AUTHORIZATION_SUBJECT: presentation.authorisation
      NATS_PRESENTATION_SUBJECT: request
    ports:
      - "127.0.0.1:8090:8090"

volumes:
  cassandra-data: