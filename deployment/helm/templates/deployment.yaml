apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- include "app.securitycontext" . | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        - name: {{ . | quote }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          env:
            {{- $annotations := default dict .Values.podAnnotations }}
            {{- $injectionEnabled := eq (default "false" (index $annotations "inject.xfsc.io/enabled")) "true" }}

            - name: CREDENTIALVERIFICATION_MIGRATIONS_TABLE
              value: {{ .Values.config.migrations.table | quote }}
            - name: CREDENTIALVERIFICATION_MIGRATIONS_ENABLED
              value: {{ .Values.config.migrations.enabled | quote }}
            - name: CREDENTIALVERIFICATION_MIGRATIONS_TIMEOUT
              value: {{ .Values.config.migrations.timeout | quote }}
            - name: CREDENTIALVERIFICATION_STATESIGNINGKEY
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-state-signing" (include "app.name" .) | quote }}
                  key: state-signing-key
            - name: CREDENTIALVERIFICATION_SERVERMODE
              value: {{ .Values.config.serverMode | quote }}
            - name: CREDENTIALVERIFICATION_SERVINGPORT
              value: {{ .Values.config.servingPort | quote }}
            - name: CREDENTIALVERIFICATION_COUNTRY
              value: {{ .Values.config.country | quote }}
            - name: CREDENTIALVERIFICATION_REGION
              value: {{ .Values.config.region | quote }}
            - name: CREDENTIALVERIFICATION_PROTOCOL
              value: {{ .Values.config.messaging.protocol | quote }}
            - name: CREDENTIALVERIFICATION_NATS_QUEUE_GROUP
              value: {{ .Values.config.messaging.nats.queueGroup | quote }}
            - name: CREDENTIALVERIFICATION_AUTHORIZATION
              value: {{ .Values.config.topics.authorization | quote }}
            - name: CREDENTIALVERIFICATION_AUTHORIZATIONREPLY
              value: {{ .Values.config.topics.authorizationReply | quote }}
            - name: CREDENTIALVERIFICATION_PROOFNOTIFY
              value: {{ .Values.config.topics.proofNotify | quote }}
            - name: CREDENTIALVERIFICATION_STORAGE_URL
              value: {{ .Values.config.storageServiceUrl | quote }}
            - name: CREDENTIALVERIFICATION_PRESENTATIONREQUEST
              value: {{ .Values.config.topics.presentationRequest | quote }}
            - name: CREDENTIALVERIFICATION_EXTERNALPRESENTATION_ENABLED
              value: {{ .Values.config.externalPresentation.enabled | quote }}
            - name: CREDENTIALVERIFICATION_EXTERNALPRESENTATION_AUTHORIZEENDPOINT
              value: {{ .Values.config.externalPresentation.authorizeEndpoint | quote }}
            - name: CREDENTIALVERIFICATION_EXTERNALPRESENTATION_CLIENTURLSCHEMA
              value: {{ .Values.config.externalPresentation.clientUrlSchema | quote }}
            - name: CREDENTIALVERIFICATION_EXTERNALPRESENTATION_REQUESTOBJECTPOLICY
              value: {{ .Values.config.externalPresentation.requestObjectPolicy | quote }}
            - name: CREDENTIALVERIFICATION_EXTERNALPRESENTATION_CREDENTIALSELECTIONPOLICY
              value: {{ .Values.config.externalPresentation.credentialSelectionPolicy | quote }}
            - name: CREDENTIALVERIFICATION_LOG_LEVEL
              value: info
            - name: CREDENTIALVERIFICATION_IS_DEV
              value: {{ .Values.config.isDev | quote }}
            - name: CREDENTIALVERIFICATION_PRESENTATIONPOLICY_URL
              value: {{ .Values.config.presentationPolicy.url | quote }}
            - name: CREDENTIALVERIFICATION_PRESENTATIONPOLICY_TIMEOUTSECONDS
              value: {{ .Values.config.presentationPolicy.timeoutSeconds | quote }}

            {{- if not $injectionEnabled }}
            # Standalone deployment: resolve all dependencies from values.yaml.
            - name: CREDENTIALVERIFICATION_NATS_URL
              value: {{ .Values.config.messaging.nats.url | quote }}
            - name: CREDENTIALVERIFICATION_NATS_REQUEST_TIMEOUT
              value: {{ .Values.config.messaging.nats.timeoutInSec | quote }}
            - name: CREDENTIALVERIFICATION_CASSANDRA_HOSTS
              value: {{ .Values.config.cassandra.host | quote }}
            - name: CREDENTIALVERIFICATION_CASSANDRA_KEYSPACE
              value: {{ .Values.config.cassandra.keyspace | quote }}
            - name: CREDENTIALVERIFICATION_CASSANDRA_USER
              value: {{ .Values.config.cassandra.user | quote }}
            - name: CREDENTIALVERIFICATION_CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.cassandra.passwordSecret | quote }}
                  key: {{ .Values.config.cassandra.passwordKey | quote }}
            - name: CREDENTIALVERIFICATION_SIGNER_PRESENTATIONSIGNURL
              value: {{ .Values.config.signer.presentationSignUrl | quote }}
            - name: CREDENTIALVERIFICATION_SIGNER_PRESENTATIONVERIFYURL
              value: {{ .Values.config.signer.presentationVerifyUrl | quote }}
            - name: CREDENTIALVERIFICATION_SIGNER_TOPIC
              value: {{ .Values.config.signer.topic | quote }}
            - name: CREDENTIALVERIFICATION_STORAGE_TOPIC
              value: {{ .Values.config.topics.storageRequest | quote }}
            - name: CREDENTIALVERIFICATION_DID_RESOLVER
              value: {{ .Values.config.didResolver | quote }}
            {{- else }}
            # Cassandra credentials are backed by the ResourceClaim/ExternalSecret.
            # Host/keyspace, NATS, signer and DID resolver endpoints are injected
            # by their ResourceProviders via inject.xfsc.io/needs.
            - name: CREDENTIALVERIFICATION_CASSANDRA_USER
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-cassandra-credentials" .Release.Name | quote }}
                  key: username
            - name: CREDENTIALVERIFICATION_CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-cassandra-credentials" .Release.Name | quote }}
                  key: password
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.http.port }}
          readinessProbe:
            httpGet:
              path: /v1/metrics/health
              port: {{ .Values.server.http.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 2
            failureThreshold: 2
            timeoutSeconds: 5
