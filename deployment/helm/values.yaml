replicaCount: 1
name: credential-verification-service

image:
  repository: node-654e3bca7fbeeed18f81d7c7.ps-xaas.io/ocm-wstack
  name: credential-verification-service
  tag: "main"
  sha: ""
  pullPolicy: Always
  # pullSecrets: key

# XFSC resource injection. When enabled, service dependencies are supplied by
# ResourceProviders and Cassandra is provisioned through the ResourceClaim.
podAnnotations:
  inject.xfsc.io/enabled: "false"
  inject.xfsc.io/needs: "nats,cassandra,signer,didresolver,storage"
  inject.xfsc.io/env-prefix: "CREDENTIALVERIFICATION"

resourceProvider:
  enabled: true
  name: ""
  scope: Cluster
  description: Credential Verification Service
  allow:
    namespaces: []

resourceClaim:
  cassandra:
    enabled: true
    providerRef: cassandra
    keyspace: ocm
    replicationFactor: 1
    durableWrites: true
    datacenter: dc1

resources: {}

service:
  port: 8080
  type: ClusterIP

server:
  http:
    host: "0.0.0.0"
    port: 8080

security:
  runAsNonRoot: false
  runAsUid: 1000
  runAsGid: 1000

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-DID did:web:cloud-wallet.xfsc.dev;
      proxy_set_header X-NAMESPACE tenant_space;
      proxy_set_header X-KEY eckey;
    nginx.org/client-max-body-size: 2K
    nginx.ingress.kubernetes.io/rewrite-target: /v1/tenants/tenant_space/presentation/$2
  hosts:
    - host: cloud-wallet.xfsc.dev
      paths:
        - path: /api/presentation(/|$)(.*)
          port: 8080
          pathType: ImplementationSpecific
  tls:
    - secretName: xfsc-wildcard
      hosts:
        - cloud-wallet.xfsc.dev

config:
  migrations:
    enabled: true
    table: verification_schema_migration
    timeout: 2m
  serverMode: production
  disableTLS: false
  servingPort: 8080
  country: DE
  region: EU

  # Used only when XFSC injection is disabled.
  didResolver: http://universal-resolver-service.default.svc.cluster.local:8080

  cassandra:
    host: cassandra.cassandra.svc.cluster.local:9042
    keyspace: ocm
    user: cassandra
    passwordSecret: cassandra
    passwordKey: cassandra-password

  externalPresentation:
    enabled: true
    authorizeEndpoint: credential-verification-service.default.svc.cluster.local:8080/v1/tenants/tenant_space/presentation/
    requestObjectPolicy: ""
    clientIdPolicy: ""
    clientUrlSchema: https

  signer:
    presentationVerifyUrl: http://signer.default.svc.cluster.local:8080/v1/presentation/verify
    presentationSignUrl: http://signer.default.svc.cluster.local:8080/v1/presentation/proof
    topic: signer-topic

  topics:
    authorization: presentation.authorisation
    authorizationReply: presentation.authorisation.reply
    proofNotify: presentation.proof.notify
    presentationRequest: request
    storageRequest: storage

  messaging:
    protocol: nats
    nats:
      url: nats://nats.nats.svc.cluster.local:4222
      queueGroup: credential-verification-service
      timeoutInSec: 10
