services:
  presentation-policy:
    build: .
    ports:
      - "127.0.0.1:8099:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
