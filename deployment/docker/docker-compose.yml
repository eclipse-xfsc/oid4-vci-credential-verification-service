name: xfsc-verification-local
services:
  nats:
    image: nats:2.10-alpine
    command: ["--http_port", "8222"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  cassandra:
    image: cassandra:5.0
    volumes: ["cassandra-data:/var/lib/cassandra"]
    ports: ["127.0.0.1:9042:9042"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 30s

  cassandra-init:
    image: cassandra:5.0
    depends_on:
      cassandra: {condition: service_healthy}
    command:
      - bash
      - -ec
      - |
        cqlsh cassandra 9042 -e "CREATE KEYSPACE IF NOT EXISTS ocm WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};"
        echo 'ocm ready' 
    restart: "no"

  openbao:
    image: openbao/openbao:2.5.3
    cap_add: [IPC_LOCK]
    command: ["server", "-dev", "-dev-root-token-id=test", "-dev-listen-address=0.0.0.0:8200"]
    ports: ["127.0.0.1:8200:8200"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      retries: 20

  openbao-init:
    image: curlimages/curl:8.12.1
    depends_on:
      openbao: {condition: service_healthy}
    volumes: ["./openbao-init.sh:/init.sh:ro"]
    environment:
      VAULT_ADDR: http://openbao:8200
      VAULT_TOKEN: test
    entrypoint: ["sh", "/init.sh"]
    restart: "no"

  crypto-engine:
    image: ${CRYPTO_ENGINE_IMAGE:-node-654e3bca7fbeeed18f81d7c7.de-west-1.xaas.plus.cloud/tsa/crypto-provider-hashicorp-vault-plugin@sha256:b65581777a9fc28d3aac5757e7125d8e996132753826d55740207166a3aff0bd}
    depends_on:
      openbao-init: {condition: service_completed_successfully}
    environment:
      CRYPTO_GRPC_ADDR: 0.0.0.0:50051
      VAULT_ADRESS: http://openbao:8200
      VAULT_TOKEN: test
    ports: ["127.0.0.1:50051:50051"]

  signer:
    image: ${SIGNER_IMAGE:-node-654e3bca7fbeeed18f81d7c7.de-west-1.xaas.plus.cloud/tsa/crypto-provider-service:2.3.7}
    depends_on:
      crypto-engine: {condition: service_started}
      nats: {condition: service_healthy}
    environment:
      CRYPTO_GRPC_ADDR: crypto-engine:50051
      ENGINE_TIMEOUT: "30"
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      NATS_HOST: nats:4222
      NATS_TOPIC: signer-topic
      LOG_LEVEL: DEBUG
    ports: ["127.0.0.1:9000:8080"]

  storage:
    image: ${STORAGE_IMAGE:-node-654e3bca7fbeeed18f81d7c7.de-west-1.xaas.plus.cloud/ocm-wstack/credential-storage-service:1.3.0}
    depends_on:
      nats: {condition: service_healthy}
      cassandra-init: {condition: service_completed_successfully}
      crypto-engine: {condition: service_started}
    environment:
      STORAGESERVICE_PROFILE: DEBUG:LOCAL
      STORAGESERVICE_MODE: DIRECT
      STORAGESERVICE_UNITTESTMODEON: "false"
      STORAGESERVICE_NATS_URL: nats:4222
      STORAGESERVICE_NATS_STORAGETOPIC: storage
      STORAGESERVICE_NATS_QUEUEGROUP: storage
      STORAGESERVICE_NATS_REQUEST_TIMEOUT: "30"
      STORAGESERVICE_CRYPTO_GRPC_ADDR: crypto-engine:50051
      STORAGESERVICE_CRYPTO_NAMESPACE: transit
      STORAGESERVICE_CRYPTO_SIGNKEY: test
      STORAGESERVICE_CRYPTO_GROUP: ""
      STORAGESERVICE_CASSANDRA_HOSTS: cassandra
      STORAGESERVICE_CASSANDRA_KEYSPACE: ocm
      STORAGESERVICE_CASSANDRA_USER: ""
      STORAGESERVICE_CASSANDRA_PASSWORD: ""
      STORAGESERVICE_MIGRATIONS_ENABLED: "true"
      STORAGESERVICE_MIGRATIONS_TABLE: schema_migrations
      STORAGESERVICE_MIGRATIONS_TIMEOUT: 2m
    ports: ["127.0.0.1:9080:8080"]

  resolver:
    image: ${RESOLVER_IMAGE:-universalresolver/uni-resolver-web:latest}
    profiles: ["resolver"]
    ports: ["127.0.0.1:8134:8080"]

  verification:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    depends_on:
      cassandra-init: {condition: service_completed_successfully}
      nats: {condition: service_healthy}
      signer: {condition: service_started}
      storage: {condition: service_started}
    environment:
      CREDENTIALVERIFICATION_LISTEN_ADDR: 0.0.0.0
      CREDENTIALVERIFICATION_LISTEN_PORT: "8080"
      CREDENTIALVERIFICATION_SERVERMODE: debug
      CREDENTIALVERIFICATION_LOG_LEVEL: debug
      CREDENTIALVERIFICATION_CASSANDRA_HOST: cassandra
      CREDENTIALVERIFICATION_CASSANDRA_KEYSPACE: ocm
      CREDENTIALVERIFICATION_CASSANDRA_USER: ""
      CREDENTIALVERIFICATION_CASSANDRA_PASSWORD: ""
      CREDENTIALVERIFICATION_COUNTRY: DE
      CREDENTIALVERIFICATION_REGION: EU
      CREDENTIALVERIFICATION_MIGRATIONS_ENABLED: "true"
      CREDENTIALVERIFICATION_NATS_URL: nats:4222
      CREDENTIALVERIFICATION_NATS_QUEUE_GROUP: verification
      CREDENTIALVERIFICATION_PROTOCOL: nats
      CREDENTIALVERIFICATION_SIGNER_TOPIC: signer-topic
      CREDENTIALVERIFICATION_SIGNER_PRESENTATIONSIGNURL: http://signer:8080/v1/presentation/proof
      CREDENTIALVERIFICATION_SIGNER_PRESENTATIONVERIFYURL: http://signer:8080/v1/presentation/verify
      CREDENTIALVERIFICATION_STORAGE_TOPIC: storage
      CREDENTIALVERIFICATION_AUTHORIZATION: presentation.authorisation
      CREDENTIALVERIFICATION_AUTHORIZATIONREPLY: presentation.authorisation.reply
      CREDENTIALVERIFICATION_PRESENTATIONREQUEST: request
      CREDENTIALVERIFICATION_PROOFNOTIFY: presentation.proof.notify
      CREDENTIALVERIFICATION_EXTERNALPRESENTATION_ENABLED: "true"
      CREDENTIALVERIFICATION_EXTERNALPRESENTATION_CLIENTURLSCHEMA: http
      CREDENTIALVERIFICATION_STATESIGNINGKEY: ${VERIFICATION_STATE_SIGNING_KEY:-local-dev-state-signing-key-change-me}
      DID_RESOLVER: ${DID_RESOLVER:-http://resolver:8080/1.0/identifiers/}
    ports: ["127.0.0.1:8086:8080"]

volumes:
  cassandra-data:
