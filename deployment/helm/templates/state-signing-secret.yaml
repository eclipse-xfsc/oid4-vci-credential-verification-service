{{- $secretName := printf "%s-state-signing" (include "app.name" .) -}}
{{- $secretKey := "state-signing-key" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $value := "" -}}
{{- if and $existing (hasKey $existing.data $secretKey) -}}
{{- $value = index $existing.data $secretKey -}}
{{- else -}}
{{- $value = (randAlphaNum 64 | b64enc) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $secretKey }}: {{ $value | quote }}
